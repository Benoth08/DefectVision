# Passerelle DefectVision : point d'entree unique pour les clients.
#   /api/      -> service d'inference FastAPI
#   /grafana/  -> tableaux de bord
#   /          -> page d'accueil (liens)
# MLflow, Airflow et Prometheus restent sur leurs ports internes (127.0.0.1).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Limitation de debit des predictions (par adresse IP).
    limit_req_zone $binary_remote_addr zone=predict:10m rate=20r/s;
    limit_req_status 429;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    upstream grafana {
        server grafana:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /api/predict {
            limit_req zone=predict burst=40 nodelay;
            proxy_pass http://api/predict;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 120s;
        }

        # /admin/reload n'est pas expose : Airflow l'appelle sur le reseau interne.
        location /api/admin/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://api/;
            include /etc/nginx/proxy_params.conf;
        }

        location /grafana/ {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Etat de nginx pour l'exportateur Prometheus (reseau interne seulement).
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
