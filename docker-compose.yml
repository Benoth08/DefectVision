# DefectVision : pile de microservices.
#
#   docker compose up -d                       service + supervision + MLflow
#   docker compose --profile airflow up -d     + orchestration Airflow
#   docker compose --profile jobs build trainer   image des taches du pipeline
#   docker compose run --rm trainer dvc repro     pipeline complet a la main
#
# Ports publies : nginx sur ${NGINX_PORT} (toutes interfaces) ; MLflow,
# Airflow et Prometheus sur 127.0.0.1 seulement (outils d'administration).

name: defectvision

x-airflow-common: &airflow-common
  image: apache/airflow:3.2.1
  restart: unless-stopped
  profiles: [airflow]
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-0}"
  networks: [defectvision]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8089}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: ${AIRFLOW_ALL_ADMINS:-False}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    DEFECTVISION_HOST_PROJECT_DIR: ${DEFECTVISION_HOST_PROJECT_DIR:-}
    DEFECTVISION_LOCAL_PROJECT_DIR: /opt/defectvision
    DEFECTVISION_TRAINER_IMAGE: defectvision-trainer:1.0.0
    DEFECTVISION_DOCKER_NETWORK: defectvision
    DEFECTVISION_TRAINER_MEM_LIMIT: ${TRAINER_MEM_LIMIT:-2g}
    DEFECTVISION_API_URL: http://api:8000
    MLFLOW_TRACKING_URI: http://mlflow:5000
    ADMIN_TOKEN: ${ADMIN_TOKEN}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
    - .:/opt/defectvision:ro
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- donnees
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: defectvision
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d defectvision"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [defectvision]

  # ---------------------------------------------------------------- suivi des experiences
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: defectvision-mlflow:1.0.0
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # Les taches de fond de MLflow 3 (evaluation GenAI, huey) ne servent pas ici et lancent
      # plusieurs processus Python supplementaires (~650 Mo constates au lieu de ~200 Mo).
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # MLflow >= 3.5 refuse tout en-tete Host autre que localhost : l'API et les taches
      # l'appellent sous le nom de service "mlflow" (constate : 403 "invalid Host header").
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks: [defectvision]

  # ---------------------------------------------------------------- service d'inference
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: defectvision-api:1.0.0
    restart: unless-stopped
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-auto}
      MODEL_DIR: /models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: defectvision
      MLFLOW_MODEL_ALIAS: champion
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ROOT_PATH: /api
      TORCH_NUM_THREADS: ${API_TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${API_TORCH_THREADS:-2}
    volumes:
      - ./models:/models:ro
      - api-cache:/home/app/.cache/defectvision
    expose: ["8000"]
    depends_on:
      mlflow:
        condition: service_started
    mem_limit: 1g
    networks: [defectvision]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on: [api, grafana]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks: [defectvision]

  # ---------------------------------------------------------------- supervision
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:80/nginx_status"]
    depends_on: [nginx]
    mem_limit: 32m
    networks: [defectvision]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    mem_limit: 256m
    networks: [defectvision]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:${NGINX_PORT:-8088}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/defectvision.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    mem_limit: 256m
    networks: [defectvision]

  # ---------------------------------------------------------------- orchestration (profil airflow)
  airflow-init:
    <<: *airflow-common
    restart: "no"
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/config
        /entrypoint airflow db migrate
        printf '{"admin": "%s"}\n' "$${AIRFLOW_ADMIN_PASSWORD}" > /opt/airflow/config/simple_auth_manager_passwords.json
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
        echo "initialisation terminee"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    mem_limit: 640m
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- taches (profil jobs)
  trainer:
    build:
      context: .
      dockerfile: docker/trainer/Dockerfile
    image: defectvision-trainer:1.0.0
    profiles: [jobs]
    working_dir: /workspace
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DV_NUM_WORKERS: ${DV_NUM_WORKERS:-2}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
    volumes:
      - .:/workspace
      # Empreintes deja calculees par DVC : sans ce volume, chaque conteneur ephemere
      # relirait toutes les images du depot monte.
      - dvc-site-cache:/var/tmp/dvc
    mem_limit: ${TRAINER_MEM_LIMIT:-2g}
    networks: [defectvision]

networks:
  defectvision:
    name: defectvision

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  api-cache:
  airflow-logs:
  airflow-config:
  # Nom fixe : les taches lancees par Airflow (DockerOperator) le montent aussi.
  dvc-site-cache:
    name: defectvision-dvc-site-cache
